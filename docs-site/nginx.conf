server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Starlight builds directory-style routes; try the pretty path, then .html, then 404.
  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }

  # Long cache for fingerprinted assets; short for HTML.
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.html$ { add_header Cache-Control "public, max-age=300"; }
}
