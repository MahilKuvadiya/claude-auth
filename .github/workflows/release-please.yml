name: release-please

on:
  push:
    branches: [main]
  # Manual recovery/publish: re-ship a given tag's binary without needing release-please
  # to re-detect a release (e.g. after a transient GitHub 5xx skipped the publish job).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. v2.2.0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT (not the default GITHUB_TOKEN) so the Release PR triggers CI.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Compile the private source into a native binary and publish it to the public
  # GCS bucket. Runs only when a Release PR is merged (a real release).
  publish:
    needs: release-please
    # Runs after a real release (push) OR a manual dispatch. `always()` lets it run even
    # when release-please was skipped (dispatch path).
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-14          # Apple Silicon (arm64) — sets the binary's macOS floor
    permissions:
      contents: read
      id-token: write          # required for keyless Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
        with:
          # On dispatch, build the exact released code at that tag.
          ref: ${{ github.event.inputs.tag || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nuitka
        run: python3 -m pip install --upgrade pip nuitka

      - name: Compile + ad-hoc sign + checksum (arm64)
        # Pin the deployment target so the binary runs on macOS 14+ regardless of
        # the runner's OS version (otherwise the floor follows the build machine).
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: make dist

      - name: Write VERSION marker
        env:
          TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: printf '%s' "${VERSION:-${TAG#v}}" > dist/VERSION

      - id: auth
        name: Authenticate to GCP (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/632653045864/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: claudex-ci@yash-test-495112.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish to the public distribution bucket
        env:
          TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # versioned (immutable) copy
          gcloud storage cp dist/claudex-arm64 "gs://claudex-dist/$TAG/claudex-arm64"
          gcloud storage cp dist/SHA256SUMS    "gs://claudex-dist/$TAG/SHA256SUMS"
          # rolling latest/ + markers
          gcloud storage cp dist/claudex-arm64 "gs://claudex-dist/latest/claudex-arm64"
          gcloud storage cp dist/SHA256SUMS    "gs://claudex-dist/latest/SHA256SUMS"
          gcloud storage cp dist/VERSION       "gs://claudex-dist/VERSION"
          gcloud storage cp packaging/install.sh "gs://claudex-dist/install.sh" \
            --content-type=text/x-shellscript
          # keep mutable objects fresh (short cache); immutable versioned copies can cache long
          gcloud storage objects update \
            "gs://claudex-dist/VERSION" \
            "gs://claudex-dist/install.sh" \
            "gs://claudex-dist/latest/claudex-arm64" \
            "gs://claudex-dist/latest/SHA256SUMS" \
            --cache-control="public, max-age=60"
