name: terraform-plan

# Drift check on every PR that touches infrastructure. Runs `fmt -check`, `validate`,
# and a read-only `plan` for the ENV roots via keyless WIF. Never applies — infra applies
# are performed deliberately (gated), not on push, to avoid surprises.
#
# The `shared` root (Cloud SQL, WIF, SAs, secrets — the sensitive foundation) is
# intentionally NOT planned here: it's admin-managed, and the CI deployer identity is
# deliberately not granted read across it. Plan/apply shared locally as an owner/admin.
on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/tf-plan.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [envs/uat, envs/prod]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/632653045864/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: claudex-deployer@yash-test-495112.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -lock=false -no-color
